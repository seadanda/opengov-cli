[package]
name = "opengov-cli"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
authors = ["joepetrowski"]

[dependencies]
anyhow = "1"
parity-scale-codec = "3.7.5"
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", rev = "73b44193c8e66acd699f04265027289d030f6c66" }
subxt = "0.42.0"
hex = "0.4.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
clap = { version = "4.4.18", features = ["derive"] }
reqwest = "0.12.3"
